config_version: concept-graph-reviews-v1
graph_version: concept-graph-v1
reviews:
  - {topic: operating-systems, prerequisite: programming, dependent: process, review_status: rejected, review_note: "Programming experience is useful background, but programming is too broad to treat as a direct prerequisite for understanding the operating-system process concept."}
  - {topic: operating-systems, prerequisite: computer architecture, dependent: memory management, review_status: accepted, review_note: "Understanding hardware memory, addressing, and the CPU-memory interface provides direct prerequisite knowledge for operating-system memory management."}
  - {topic: operating-systems, prerequisite: process, dependent: thread, review_status: accepted, review_note: "A thread is understood in relation to a process and its shared address space and resources, so process knowledge is a direct prerequisite for learning threads."}
  - {topic: operating-systems, prerequisite: process, dependent: scheduling, review_status: accepted, review_note: "Operating-system scheduling selects among executable processes or related execution units, so understanding processes is direct prerequisite knowledge for scheduling."}
  - {topic: operating-systems, prerequisite: process, dependent: concurrency, review_status: accepted, review_note: "In operating-systems context, understanding independently progressing processes provides direct background for reasoning about concurrent execution."}
  - {topic: operating-systems, prerequisite: thread, dependent: concurrency, review_status: accepted, review_note: "Threads are a primary operating-system execution unit used to explain concurrent execution and shared-state interaction, making thread knowledge a direct prerequisite candidate for concurrency."}
  - {topic: operating-systems, prerequisite: concurrency, dependent: synchronization, review_status: accepted, review_note: "Synchronization exists to coordinate concurrent execution and shared-state access, so concurrency is direct prerequisite knowledge for understanding synchronization."}
  - {topic: operating-systems, prerequisite: synchronization, dependent: deadlock, review_status: accepted, review_note: "Understanding synchronization and coordinated resource access provides direct background for reasoning about waiting cycles and deadlock conditions."}
  - {topic: operating-systems, prerequisite: memory management, dependent: virtual memory, review_status: accepted, review_note: "Virtual memory builds on general operating-system memory-management concepts such as address spaces, physical memory allocation, and address translation, so memory management is direct prerequisite knowledge."}
  - {topic: operating-systems, prerequisite: storage, dependent: file system, review_status: accepted, review_note: "Understanding persistent storage and basic storage organization provides direct prerequisite knowledge for reasoning about file-system layout, allocation, and persistent data management."}
  - {topic: linear-algebra, prerequisite: high school algebra, dependent: linear system, review_status: accepted, review_note: "Manipulating variables, equations, and elementary algebraic expressions is direct prerequisite knowledge for understanding and solving linear systems."}
  - {topic: linear-algebra, prerequisite: systems of equations, dependent: linear system, review_status: rejected, review_note: "Systems of equations and linear systems overlap too strongly at the current canonical-concept granularity to treat one as a distinct prerequisite of the other without introducing redundant readiness requirements."}
  - {topic: linear-algebra, prerequisite: linear system, dependent: gaussian elimination, review_status: accepted, review_note: "Gaussian elimination is a procedure for transforming and solving linear systems, so understanding the linear-system problem structure is direct prerequisite knowledge."}
  - {topic: linear-algebra, prerequisite: vector, dependent: vector space, review_status: accepted, review_note: "Understanding vectors and their basic addition and scalar-multiplication operations provides direct prerequisite knowledge for the abstraction of a vector space."}
  - {topic: linear-algebra, prerequisite: vector space, dependent: basis, review_status: accepted, review_note: "A basis is defined as a linearly independent spanning set of a vector space, so understanding the vector-space structure is direct prerequisite knowledge for learning bases."}
  - {topic: linear-algebra, prerequisite: vector space, dependent: linear independence, review_status: rejected, review_note: "Linear independence can be introduced and understood concretely for vectors in coordinate spaces before the abstract notion of a vector space is taught, so abstract vector-space knowledge is not required as a direct prerequisite."}
  - {topic: linear-algebra, prerequisite: vector space, dependent: dimension, review_status: needs_revision, review_note: "Dimension is a property of a vector space, but basis is the more direct prerequisite because vector-space dimension is defined through the size of a basis. Consider the more explicit learning chain vector space -> basis -> dimension."}
  - {topic: linear-algebra, prerequisite: matrix, dependent: determinant, review_status: accepted, review_note: "A determinant is defined for square matrices and depends directly on understanding matrix structure and entries, so matrix knowledge is a direct prerequisite for learning determinants."}
  - {topic: linear-algebra, prerequisite: matrix, dependent: rank, review_status: accepted, review_note: "Matrix rank is a property of a matrix and is learned through its rows, columns, pivots, or associated linear structure, so matrix knowledge is a direct prerequisite."}
  - {topic: linear-algebra, prerequisite: matrix, dependent: linear transformation, review_status: needs_revision, review_note: "Matrices are an important representation of linear transformations, but a linear transformation can be defined independently as a structure-preserving map between vector spaces. Consider whether vector space -> linear transformation is the more appropriate prerequisite relation."}
  - {topic: linear-algebra, prerequisite: matrix, dependent: eigenvalue, review_status: accepted, review_note: "In the current introductory linear-algebra scope, understanding matrices and matrix-vector multiplication provides direct prerequisite knowledge for defining, computing, and interpreting eigenvalues."}
  - {topic: linear-algebra, prerequisite: eigenvalue, dependent: eigenvector, review_status: rejected, review_note: "Eigenvalues and eigenvectors are normally introduced together through the same relation Av = lambda v, so treating eigenvalue as a separate prerequisite that must precede eigenvector would create an artificial sequential dependency."}
  - {topic: linear-algebra, prerequisite: inner product, dependent: orthogonality, review_status: accepted, review_note: "Orthogonality in an inner-product space is defined through a zero inner product, so understanding the inner product provides direct prerequisite knowledge for orthogonality."}
  - {topic: linear-algebra, prerequisite: orthogonality, dependent: least squares, review_status: accepted, review_note: "The geometric interpretation of least squares relies directly on orthogonal projection and an orthogonal residual, making orthogonality direct prerequisite knowledge for understanding least-squares methods."}
