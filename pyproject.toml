[project]
name = "bookmatch-ml"
version = "0.1.0"
description = "Evidence-aware book profiling and matching for the CAU capstone project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.16,<1",
]

[project.scripts]
bookmatch-ml = "bookmatch_ml.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookmatch_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
